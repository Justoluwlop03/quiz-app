<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="csrf-token" content="{{ csrf_token() }}"><title>{% block title %}Quizbank{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body><header class="topbar"><a class="brand" href="{{ url_for('index') }}"><span class="brand-mark">Q</span> Quizbank</a><nav>{% if session.get('admin_id') %}<a href="{{ url_for('dashboard') }}">Admin</a><form class="inline" method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="nav-button">Sign out</button></form>{% else %}<a href="{{ url_for('login') }}">Admin sign in</a>{% endif %}</nav></header>
<main class="container">{% for category, message in get_flashed_messages(with_categories=true) %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main><footer>Questions stay connected to their source PDF.</footer></body></html>
